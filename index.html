<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Batch Image Watermark</title>
  <style>
    #container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .canvas-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      max-width: 90vw;
    }
    .canvas-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }
    canvas {
      border: 1px solid black;
      max-width: 300px;
      max-height: 300px;
    }
    button {
      margin: 5px;
      padding: 5px 10px;
    }
    label {
      display: block;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <div id="container">
    <h2>Upload Images and Add Watermark</h2>
    <input type="file" id="imageUpload" accept="image/*" multiple>
    <input type="text" id="watermarkText" placeholder="Enter watermark text" oninput="updateAllWatermarks()">
    
    <label>Size: <input type="range" id="sizeSlider" min="5" max="100" value="20" oninput="updateAllWatermarks()"></label>
    <label>Opacity: <input type="range" id="opacitySlider" min="0" max="100" value="50" oninput="updateAllWatermarks()"></label>
    <label>Rotation: <input type="range" id="rotationSlider" min="-45" max="45" value="0" oninput="updateAllWatermarks()"></label>
    
    <label>Position:
      <select id="positionSelect" onchange="updateAllWatermarks(); toggleDistanceSlider();">
        <option value="center">Center</option>
        <option value="top-left">Top Left</option>
        <option value="top-right">Top Right</option>
        <option value="bottom-left">Bottom Left</option>
        <option value="bottom-right">Bottom Right</option>
      </select>
    </label>

    <label id="distanceLabel" style="display: none;">Distance from Edge:
      <input type="range" id="distanceSlider" min="5" max="100" value="20" oninput="updateAllWatermarks()">
    </label>

    <button id="saveAllBtn" style="display: none;" onclick="saveAllImages()">Save All</button>

    <div class="canvas-container" id="canvasContainer"></div>
  </div>

  <script>
    let images = [];
    let originalFileNames = [];

    document.getElementById('imageUpload').addEventListener('change', function(event) {
      images = [];
      originalFileNames = [];
      document.getElementById('canvasContainer').innerHTML = "";

      Array.from(event.target.files).forEach(file => {
        let reader = new FileReader();
        let img = new Image();
        originalFileNames.push(file.name.split('.')[0]);

        reader.onload = function(e) {
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);

        img.onload = function() {
          let canvas = document.createElement('canvas');
          let ctx = canvas.getContext('2d');
          
          let maxWidth = 300;
          let scale = maxWidth / img.width;
          canvas.width = img.width * scale;
          canvas.height = img.height * scale;

          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

          images.push({ img, canvas, ctx });

          let wrapper = document.createElement('div');
          wrapper.classList.add('canvas-wrapper');
          wrapper.appendChild(canvas);

          let saveBtn = document.createElement('button');
          saveBtn.textContent = "Save";
          saveBtn.onclick = () => saveImage(canvas, originalFileNames[images.length - 1]);
          wrapper.appendChild(saveBtn);

          document.getElementById('canvasContainer').appendChild(wrapper);
          updateWatermark(canvas, ctx, img);
        };
      });

      document.getElementById('saveAllBtn').style.display = images.length > 1 ? "block" : "none";
    });

    function updateWatermark(canvas, ctx, img) {
      let text = document.getElementById('watermarkText').value;
      let fontSize = (canvas.width * document.getElementById('sizeSlider').value) / 100;
      let opacity = document.getElementById('opacitySlider').value / 100;
      let rotation = document.getElementById('rotationSlider').value * (Math.PI / 180);
      let position = document.getElementById('positionSelect').value;
      let distance = parseInt(document.getElementById('distanceSlider').value);

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

      ctx.font = `${fontSize}px Arial`;
      ctx.fillStyle = `rgba(255, 255, 255, ${opacity})`;
      ctx.textBaseline = 'middle';

      let textMetrics = ctx.measureText(text);
      let textWidth = textMetrics.width;
      let textHeight = fontSize; 

      let x, y;

      switch (position) {
        case "top-left":
          x = distance + textWidth / 2;
          y = distance + textHeight / 2;
          ctx.textAlign = "center";
          break;
        case "top-right":
          x = canvas.width - distance - textWidth / 2;
          y = distance + textHeight / 2;
          ctx.textAlign = "center";
          break;
        case "bottom-left":
          x = distance + textWidth / 2;
          y = canvas.height - distance - textHeight / 2;
          ctx.textAlign = "center";
          break;
        case "bottom-right":
          x = canvas.width - distance - textWidth / 2;
          y = canvas.height - distance - textHeight / 2;
          ctx.textAlign = "center";
          break;
        default:
          x = canvas.width / 2;
          y = canvas.height / 2;
          ctx.textAlign = "center";
      }

      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rotation);
      ctx.fillText(text, 0, 0);
      ctx.restore();
    }

    function updateAllWatermarks() {
      images.forEach(({ canvas, ctx, img }) => {
        updateWatermark(canvas, ctx, img);
      });
    }

    function toggleDistanceSlider() {
      let position = document.getElementById('positionSelect').value;
      let distanceLabel = document.getElementById('distanceLabel');
      distanceLabel.style.display = position === "center" ? "none" : "block";
    }

    function saveImage(canvas, fileName) {
      let link = document.createElement('a');
      link.href = canvas.toDataURL();
      link.download = `${fileName}-Watermarked.png`;
      link.click();
    }

    function saveAllImages() {
      images.forEach(({ canvas }, index) => {
        saveImage(canvas, originalFileNames[index]);
      });
    }
  </script>
</body>
</html>
