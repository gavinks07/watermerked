<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Watermark</title>
  <style>
    #canvas {
      border: 2px solid black;
      max-width: 100%;
    }
    #container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }
    button {
      margin: 5px;
    }
    label {
      display: flex;
      align-items: center;
      gap: 5px;
    }
  </style>
</head>
<body>
  <div id="container">
    <h2>Upload Image and Add Watermark</h2>
    <input type="file" id="imageUpload" accept="image/*">
    <input type="text" id="watermarkText" placeholder="Enter watermark text">
    <label>
      <input type="checkbox" id="subtleMode"> Subtle Watermark (Bottom Right)
    </label>
    <button onclick="addWatermark()">Add Watermark</button>
    <canvas id="canvas"></canvas>
    <button onclick="saveImage()">Save Image</button>
  </div>

  <script>
    let canvas = document.getElementById('canvas');
    let ctx = canvas.getContext('2d');
    let img = new Image();
    let originalFileName = '';

    document.getElementById('imageUpload').addEventListener('change', function(e) {
      let file = e.target.files[0];
      originalFileName = file.name.split('.')[0]; // Get file name without extension
      let reader = new FileReader();
      reader.onload = function(event) {
        img.onload = function() {
          canvas.width = img.width;
          canvas.height = img.height;
          ctx.drawImage(img, 0, 0);
        }
        img.src = event.target.result;
      }
      reader.readAsDataURL(file);
    });

    function addWatermark() {
      let text = document.getElementById('watermarkText').value;
      let subtleMode = document.getElementById('subtleMode').checked;
      ctx.drawImage(img, 0, 0); // Reset image

      if (subtleMode) {
        addSubtleWatermark(text);
      } else {
        addCenteredWatermark(text);
      }
    }

    function addCenteredWatermark(text) {
      let fontSize = canvas.width / 8;
      ctx.font = `${fontSize}px Arial`;
      ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      let x = canvas.width / 2;
      let y = canvas.height / 2;
      let maxWidth = canvas.width * 0.9;

      let lines = getWrappedText(ctx, text, maxWidth);
      lines.forEach((line, index) => {
        ctx.fillText(line, x, y + (index * fontSize));
      });
    }

    function addSubtleWatermark(text) {
      let fontSize = canvas.width / 20;
      ctx.font = `${fontSize}px Arial`;
      ctx.fillStyle = 'rgba(255, 255, 255, 0.3)'; // More transparent for subtlety
      ctx.textAlign = 'right';
      ctx.textBaseline = 'bottom';

      let x = canvas.width - (fontSize * 0.5);
      let y = canvas.height - (fontSize * 0.5);

      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(-0.2); // Slight rotation
      ctx.fillText(text, 0, 0);
      ctx.restore();
    }

    function getWrappedText(ctx, text, maxWidth) {
      let words = text.split(' ');
      let lines = [];
      let currentLine = words[0];

      for (let i = 1; i < words.length; i++) {
        let word = words[i];
        let width = ctx.measureText(currentLine + ' ' + word).width;
        if (width < maxWidth) {
          currentLine += ' ' + word;
        } else {
          lines.push(currentLine);
          currentLine = word;
        }
      }
      lines.push(currentLine);
      return lines;
    }

    function saveImage() {
      let imageUrl = canvas.toDataURL();
      let link = document.createElement('a');
      link.href = imageUrl;
      link.download = `${originalFileName}-Watermarked.png`;
      
      // Opens image in a new tab (for iPhone users to long-press & save)
      link.target = '_blank';
      link.click();
    }
  </script>
</body>
</html>
